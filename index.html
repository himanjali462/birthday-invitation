<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="balloons">🎈 🎂 🎈</div>
        <h1>You're Invited!</h1>
        <h2>Birthday Party</h2>
        <p>Let's celebrate a special day filled with happiness, laughter, and cake!</p>

        <div class="details">
            <p>📅 Date: 15 November 2026</p>
            <p>⏰ Time: 5:00 PM</p>
            <p>📍 Venue: My Home</p>
        </div>

        <button onclick="confirmAttendance()">
    Count Me In!
</button>

<script>
function confirmAttendance() {
    alert("🎉 Thank you! Your attendance is confirmed. See you at the party! 🎂");
}
</script>
        <p class="footer">Hope to see you there! 💖</p>
    </div>
</body>
</html>
